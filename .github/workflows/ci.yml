name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: Installer dry-run test
        run: bash tests/test_install.sh
